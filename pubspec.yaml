name: stargazing_social
description: A Flutter mobile app for the Stargazing Social Community platform where astronomy enthusiasts connect, share observations, and coordinate viewing sessions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  firebase_core: ^2.24.0
  cloud_firestore: ^4.13.0
  firebase_auth: ^4.15.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.7.0
  geolocator: ^10.1.0
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  go_router: ^12.1.1
  dio: ^5.4.0
  equatable: ^2.0.5
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  bloc_test: ^9.1.5
  mocktail: ^1.0.1

flutter:
  uses-material-design: true
  
  # Add assets here when needed
  # assets:
  #   - assets/images/
  #   - assets/icons/
